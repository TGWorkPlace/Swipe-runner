<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Swipe Runner</title>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--ac:#22c55e;--ov:rgba(2,6,23,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#pause{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer}
#mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:60px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at center,rgba(15,23,42,.7),rgba(2,6,23,.93));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-align:center;padding:20px}
#ov.hide{display:none}
#ov h1{margin:0;font-size:clamp(28px,6.5vw,50px);background:linear-gradient(90deg,#fde047,#fb923c,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
#ov p{margin:0;opacity:.85;line-height:1.5;font-size:clamp(14px,3vw,17px)}
#ov button{margin-top:8px;padding:12px 30px;font-size:18px;font-weight:700;border:0;border-radius:999px;background:linear-gradient(180deg,#4ade80,#16a34a);color:#04210f;cursor:pointer;box-shadow:0 6px 0 #166534,0 10px 24px rgba(34,197,94,.35);transition:transform .08s}
#ov button:active{transform:translateY(4px);box-shadow:0 2px 0 #166534}
#rot{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#020617;text-align:center;padding:20px}
#rot span{font-size:64px;display:inline-block;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
#wrap.rot{position:fixed;left:0;top:0;transform-origin:0 0}
#err{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;padding:8px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<button id="mute" aria-label="Sound">🔊</button><button id="pause" aria-label="Pause">⏸</button>
<div id="ov"><h1>🏃 Swipe Runner</h1><p>⬆️ Jump &nbsp; ⬇️ Slide &nbsp; ⬅️➡️ Move<br>☀️ Jump the pits &nbsp; 🌙 Beware ghosts &amp; the dark<br>Grab coins!</p><p id="best"></p><button id="go">Start</button></div>
</div>
<div id="rot"><span>📱</span><h2 style="margin:0">Rotate your phone</h2><p style="margin:0;opacity:.8">Swipe Runner plays in landscape</p></div>
<div id="err"></div>
<script>
function showErr(e){const d=document.getElementById('err');d.style.display='block';d.textContent='Error: '+(e&&e.message||e);}
addEventListener('error',e=>showErr(e.error||e.message));
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false}),ov=document.getElementById('ov'),go=document.getElementById('go'),pb=document.getElementById('pause');
const H=420;let W=800,S=1,dpr=1;
let best=0;try{best=+localStorage.getItem('runnerBest')||0}catch(e){}
const wrap=document.getElementById('wrap');
function layout(){const p=innerHeight>innerWidth;if(p){wrap.className='rot';wrap.style.width=innerHeight+'px';wrap.style.height=innerWidth+'px';wrap.style.transform='translateX('+innerWidth+'px) rotate(90deg)';}else{wrap.className='';wrap.style.width='100%';wrap.style.height='100%';wrap.style.transform='none';}}
function resize(){layout();dpr=Math.min(devicePixelRatio||1,1.5);const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;S=h/H;W=w/S;}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();

// Try fullscreen + landscape lock (needs a tap; unsupported on iOS -> rotate prompt covers it)
function land(){try{const d=document.documentElement,p=(!document.fullscreenElement&&d.requestFullscreen)?d.requestFullscreen():Promise.resolve();
 Promise.resolve(p).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{});}catch(e){}}
const portrait=()=>innerHeight>innerWidth;

let state='start',P=[],flash=0,ban={t:0,txt:''},lastMs=1,dustT=0,airPrev=0,needH=0,hts=[],fall=0,wasN=0,lastMix=0,px,py,vy,duck,lives,score,coins,dist,speed,inv,obs,cns,spawn,time,shake;
const G=2100,JUMP=-780,GY=()=>H-70,DAY=60;
const clouds=Array.from({length:6},()=>({x:Math.random()*1200,y:30+Math.random()*120,s:.6+Math.random()*.8}));
const hills=Array.from({length:8},(_,i)=>({x:i*220,h:60+Math.random()*80,w:260}));
const stars=Array.from({length:50},()=>({x:Math.random(),y:Math.random()*.6,r:.6+Math.random()*1.4,p:Math.random()*6}));
let bgx=0;

// Sky palette across one day (phase 0..1): early morning -> noon -> evening -> night -> pre-dawn
const SKY=[[0,'#4f6fd8','#fdba74'],[.12,'#3b82f6','#bae6fd'],[.25,'#2563eb','#7dd3fc'],[.38,'#3b82c4','#fde68a'],[.47,'#7c3a8a','#f97316'],[.55,'#1e1b4b','#7c2d5a'],[.65,'#0b1026','#1e1b4b'],[.85,'#050816','#172554'],[.95,'#1e2a5e','#9a5b6e'],[1,'#4f6fd8','#fdba74']];
const HX={},hex=h=>HX[h]||(HX[h]=[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
function mix(a,b,t){const x=hex(a),y=hex(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')';}
function sky(p){for(let i=0;i<SKY.length-1;i++){const a=SKY[i],b=SKY[i+1];if(p<=b[0]){const t=(p-a[0])/(b[0]-a[0]);return[mix(a[1],b[1],t),mix(a[2],b[2],t)];}}return[SKY[0][1],SKY[0][2]];}
function nightF(p){if(p<.1)return .3*(1-p/.1);if(p<.45)return 0;if(p<.6)return (p-.45)/.15;if(p<.92)return 1;return 1-.7*(1-(1-p)/.08);}
const phase=()=>(time%DAY)/DAY;
const isNight=()=>nightF(phase())>.5;

function reset(){P=[];flash=0;ban.t=0;lastMs=1;airPrev=0;needH=0;hts=[];fall=0;wasN=0;px=Math.min(W*.25,140);py=GY();vy=0;duck=0;lives=3;score=0;coins=0;dist=0;speed=300;inv=0;obs=[];cns=[];spawn=400;time=0;shake=0;}
function start(){land();initAudio();reset();banner('☀️ Good morning!');state='play';ov.classList.add('hide');last=performance.now();}
function setBest(){if(score>best){best=score;try{localStorage.setItem('runnerBest',best)}catch(e){}}}
function showOv(title,msg,btn){ov.innerHTML='<h1>'+title+'</h1><p>'+msg+'</p><p>🏆 Best: '+best+'</p><button id="go">'+btn+'</button>';ov.classList.remove('hide');document.getElementById('go').onclick=btn==='Resume'?resume:start;}
function pause(){if(state!=='play')return;state='pause';if(AC)AC.suspend();showOv('⏸️ Paused','Take a breather','Resume');}
function resume(){land();if(AC)AC.resume();state='play';ov.classList.add('hide');last=performance.now();}
function gameOver(){state='over';setBest();showOv('💀 Game Over','Score: '+score+' &nbsp; 🪙 '+coins,'Restart');}
pb.onclick=()=>state==='play'?pause():state==='pause'?resume():0;
go.onclick=start;document.getElementById('best').textContent='🏆 Best: '+best;

// ===== Audio (synthesized, no files) =====
let AC,mg,wg,sg,muted=false,lastCoin=0;
function initAudio(){try{_initAudio();}catch(e){AC=null;}}
function _initAudio(){if(AC){AC.resume&&AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 mg=AC.createGain();mg.gain.value=muted?0:1;const cp=AC.createDynamicsCompressor();cp.threshold.value=-20;cp.ratio.value=10;cp.connect(AC.destination);mg.connect(cp);
 wg=AC.createGain();wg.gain.value=0;wg.connect(mg); // warm day pad
 [196,246.94,293.66,392].forEach((f,i)=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f;
  const vg=AC.createGain();vg.gain.value=.25;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.15+i*.07;lg.gain.value=.22;l.connect(lg);lg.connect(vg.gain);
  o.connect(vg);vg.connect(wg);o.start();l.start();});
 sg=AC.createGain();sg.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;lp.Q.value=5;lp.connect(sg);sg.connect(mg); // spooky night drone
 [[110,'sawtooth'],[116.5,'sawtooth'],[155.6,'sawtooth'],[220,'sine']].forEach(([f,t])=>{const o=AC.createOscillator();o.type=t;o.frequency.value=f;const g=AC.createGain();g.gain.value=.35;o.connect(g);g.connect(lp);o.start();});
 const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.23;lg.gain.value=450;l.connect(lg);lg.connect(lp.frequency);l.start();}
function tone(f1,f2,d,type,v){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05);}
function noise(d,v){if(!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(mg);s.start();}
function eerie(){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='sine';o.frequency.setValueAtTime(640,t);o.frequency.linearRampToValueAtTime(470,t+2.2);
 l.frequency.value=5;lg.gain.value=9;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.7);g.gain.linearRampToValueAtTime(0,t+2.2);
 o.connect(g);g.connect(mg);o.start(t);l.start(t);o.stop(t+2.3);l.stop(t+2.3);}
function snd(k){if(!AC)return;
 if(k==='jump')tone(260,620,.16,'triangle',.3);
 else if(k==='coin'){const tm=performance.now();if(tm-lastCoin<70)return;lastCoin=tm;tone(988,988,.07,'square',.12);setTimeout(()=>tone(1319,1319,.16,'square',.12),70);}
 else if(k==='hit'){noise(.28,.5);tone(180,45,.35,'sawtooth',.35);}
 else if(k==='fall')tone(520,70,.7,'sine',.35);
 else if(k==='dash')tone(1000,180,.3,'sawtooth',.12);
 else if(k==='rise')tone(130,45,.25,'sine',.4);
 else if(k==='sting'){tone(700,90,2,'sine',.3);tone(350,60,2.2,'sawtooth',.15);noise(1.2,.12);}
 else if(k==='heart'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.25,'sine',.2),i*80));}
 else if(k==='dawn'){tone(523,523,1,'sine',.18);setTimeout(()=>tone(784,784,1.2,'sine',.15),250);}}
function audioMix(){if(!AC)return;const now=AC.currentTime;if(now-lastMix<.1)return;lastMix=now;const on=state==='play',n=nightF(phase());
 wg.gain.setTargetAtTime(on?(1-n)*.3:0,now,.5);sg.gain.setTargetAtTime(on?n*.55:0,now,.5);
 if(on&&n>.8&&Math.random()<.02)eerie();}
document.getElementById('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';if(mg)mg.gain.value=muted?0:1;};

// Controls
function act(d){if(state!=='play'||fall)return;
 if(d==='up'&&py>=GY()-1){vy=JUMP;duck=0;snd('jump');dust(px,GY(),6);}
 else if(d==='down'){if(py<GY()-1)vy=Math.max(vy,900);else duck=.6;}
 else if(d==='left')px=Math.max(30,px-90);
 else if(d==='right')px=Math.min(W*.6,px+90);}
let sx,sy;
addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0];let dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(innerHeight>innerWidth){const q=dx;dx=dy;dy=-q;}
 if(Math.max(Math.abs(dx),Math.abs(dy))<24){if(state==='play'&&e.target===cv)act('up');return;}
 act(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));},{passive:true});
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{const k=e.key;
 if(k==='ArrowUp'||k==='w'||k===' '){e.preventDefault();act('up');}
 else if(k==='ArrowDown'||k==='s'){e.preventDefault();act('down');}
 else if(k==='ArrowLeft'||k==='a')act('left');
 else if(k==='ArrowRight'||k==='d')act('right');
 else if(k==='p'||k==='Escape')state==='play'?pause():state==='pause'?resume():0;
 else if(k==='Enter'&&state!=='play'&&state!=='pause')start();});

// Spawning: tomb/ghost at night (n:1), rock/bird by day
function spawnStuff(){
 const g=GY(),n=isNight()?1:0;
 if(!n&&phase()<.3&&Math.random()<.3){ // morning pits
  const w=95+Math.random()*50;obs.push({t:'pit',n:0,x:W+40,w,h:0,y:g});
  for(let i=0;i<5;i++)cns.push({x:W+40+w/2+(i-2)*30,y:g-105-Math.sin(i/4*Math.PI)*28,r:10,a:i});
  spawn=speed*1.1+w;return;}
 const tomb=(t,w,h,xo=0)=>{const o={t,n,x:W+40+xo,w,h,y:g-h};if(n&&Math.random()<.35){o.rise=1;o.ty=g-h;o.y=g;}obs.push(o);}; // night: some tombs rise from the ground
 const ro=Math.random();
 if(ro<.4)tomb('rock',34,34);
 else if(ro<.65)tomb('big',44,56);
 else if(ro<.85)obs.push({t:'bird',n,x:W+40,w:40,h:n?34:24,y:n?g-60:g-52,by:n?g-60:g-52,f:Math.random()*6,fast:(n&&Math.random()<.5)?1:0}); // night: some ghosts dash
 else{tomb('rock',34,34);tomb('rock',34,34,36);}
 if(needH&&!hts.length&&Math.random()<.6){hts.push({x:W+200,y:g-80,a:0});}
 else if(Math.random()<.7){const k=3+(Math.random()*3|0),base=g-30-(Math.random()<.5?0:90);
  for(let i=0;i<k;i++)cns.push({x:W+140+i*34,y:base-Math.sin(i/(k-1||1)*Math.PI)*40,r:10,a:Math.random()*6});}
 spawn=speed*(.95+Math.random()*.7);}
const hit=(a,b,p=6)=>a.x+p<b.x+b.w&&a.x+a.w-p>b.x&&a.y+p<b.y+b.h&&a.y+a.h-p>b.y;

function update(dt){const n=Math.max(1,Math.ceil(speed*dt/18));for(let i=0;i<n&&state==='play';i++)step(dt/n);}
function step(dt){
 time+=dt;{const r=dist*.012;speed=300+(r<560?r:560+(r-560)*.35);}dist+=speed*dt; // speed ramps up with distance
 bgx+=speed*dt;
 score=Math.floor(dist/10)+coins*10;
 vy+=G*dt;py+=vy*dt;const g=GY();
 if(!fall&&py>=g){if(obs.some(o=>o.t==='pit'&&px>o.x+10&&px<o.x+o.w-10)){fall=1;snd('fall');}else{if(airPrev)dust(px,g,7);py=g;vy=0;}}
 if(fall&&py>H+70){lives--;snd('hit');flash=.35;inv=1.8;shake=.3;fall=0;py=g;vy=0;obs=obs.filter(o=>!(o.t==='pit'&&px>o.x-30&&px<o.x+o.w+30));if(lives<=0){gameOver();return;}}
 {const nn=isNight();if(nn&&!wasN){snd('sting');banner('🌙 Night falls...');}if(!nn&&wasN){snd('dawn');banner('🌅 A new dawn');}wasN=nn;}
 if(lives<=1)needH=1;if(lives>=3){needH=0;hts=[];}
 if(flash>0)flash-=dt;if(ban.t>0)ban.t-=dt;
 {const ms=Math.floor(speed/300);if(ms>lastMs){lastMs=ms;if(ms>=2)banner('⚡ Speed x'+ms+'!');}}
 if(py>=g-1&&!fall){dustT-=dt;if(dustT<=0){dustT=.07;emit(px-8,g,1,{c:'214,190,150',sp:3,vx:-20,rv:30,vy:-25,rvy:30,r:2.8,m:.4,g:80});}}
 for(const q of P){q.l-=dt;q.x+=(q.vx-speed)*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;}
 P=P.filter(q=>q.l>0);airPrev=py<g-1;
 if(duck>0)duck-=dt;
 spawn-=speed*dt;if(spawn<=0)spawnStuff();
 if(inv>0)inv-=dt;if(shake>0)shake-=dt;
 const ducking=duck>0&&py>=g-1&&!fall,ph=ducking?24:50,pw=ducking?44:28;
 const pr={x:px-pw/2,y:py-ph,w:pw,h:ph};
 for(const o of obs){let v=speed;if(o.fast&&!o.dash&&o.x<W*.8){o.dash=1;snd('dash');}if(o.dash)v=speed*1.75;o.x-=v*dt;
  if(o.t==='bird'){o.f+=dt*(o.n?4:10);if(o.n)o.y=o.by+Math.sin(o.f)*6;}
  if(o.rise&&o.rp===undefined&&o.x-px<speed*.6){o.rp=0;snd('rise');}
  if(o.rp!==undefined&&o.rp<1){o.rp=Math.min(1,o.rp+dt/.25);o.y=o.ty+o.h*(1-o.rp);}
  if(o.t!=='pit'&&!fall&&inv<=0&&hit(pr,o)){snd('hit');burst(px,py-25,18,'248,113,113');flash=.35;lives--;inv=1.6;shake=.3;if(navigator.vibrate)navigator.vibrate(80);if(lives<=0){gameOver();return;}}}
 for(const c of cns){c.x-=speed*dt;c.a+=dt*6;
  if(!c.d&&Math.hypot(c.x-px,c.y-(py-ph/2))<c.r+20){c.d=1;coins++;snd('coin');burst(c.x,c.y,9,'250,204,21');}}
 obs=obs.filter(o=>o.x+o.w>-40);cns=cns.filter(c=>c.x>-30&&!c.d);
 for(const h of hts){h.x-=speed*dt;h.a+=dt*4;if(!h.d&&lives<3&&Math.hypot(h.x-px,h.y-(py-ph/2))<34){h.d=1;lives=Math.min(3,lives+1);snd('heart');burst(h.x,h.y,16,'244,63,94');}}
 hts=hts.filter(h=>h.x>-40&&!h.d);if(lives>=3){needH=0;hts=[];}
}

const GC={};
function glow(x,y,r,c,a){let sp=GC[c];if(!sp){sp=document.createElement('canvas');sp.width=sp.height=64;const k=sp.getContext('2d'),g=k.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba('+c+',1)');g.addColorStop(1,'rgba('+c+',0)');k.fillStyle=g;k.fillRect(0,0,64,64);GC[c]=sp;}
 ctx.globalAlpha=Math.min(1,a);ctx.drawImage(sp,x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
const VIG=document.createElement('canvas');VIG.width=VIG.height=256;
{const k=VIG.getContext('2d'),g=k.createRadialGradient(128,128,128*90/330,128,128,128);g.addColorStop(0,'rgba(0,0,10,0)');g.addColorStop(1,'rgba(0,0,10,.93)');k.fillStyle=g;k.fillRect(0,0,256,256);}
const TINT=document.createElement('canvas');TINT.width=1;TINT.height=64;
{const k=TINT.getContext('2d'),g=k.createLinearGradient(0,0,0,64);g.addColorStop(0,'rgba(2,6,23,0)');g.addColorStop(1,'rgba(2,6,23,.45)');k.fillStyle=g;k.fillRect(0,0,1,64);}
// ===== Graphics assets (pre-rendered once for speed) =====
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c;}
const nz=(s,a)=>mk(s.width,s.height,k=>{k.drawImage(s,0,0);k.globalCompositeOperation='source-atop';k.fillStyle='rgba(6,10,44,'+a+')';k.fillRect(0,0,s.width,s.height);});

function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;
